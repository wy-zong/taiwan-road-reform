name: 🚗 道路問題回報
description: 回報需要改善的道路設計或交通問題
title: "[地點] 問題簡述"
labels: ["狀態/待確認"]
body:
  - type: markdown
    attributes:
      value: |
        感謝你回報問題！請盡可能詳細填寫，幫助我們追蹤與處理。
        如有不確定的欄位，可以留空，由社群後續補充。

  - type: input
    id: location
    attributes:
      label: 📍 地點
      description: 具體地址、路口名稱或 Google Maps 連結
      placeholder: 例：台北市大安區復興南路一段與仁愛路口
    validations:
      required: true

  - type: dropdown
    id: city
    attributes:
      label: 🏙️ 縣市
      options:
        - 台北市
        - 新北市
        - 桃園市
        - 台中市
        - 台南市
        - 高雄市
        - 基隆市
        - 新竹市
        - 新竹縣
        - 苗栗縣
        - 彰化縣
        - 南投縣
        - 雲林縣
        - 嘉義市
        - 嘉義縣
        - 屏東縣
        - 宜蘭縣
        - 花蓮縣
        - 台東縣
        - 澎湖縣
        - 金門縣
        - 連江縣
    validations:
      required: true

  - type: input
    id: map_url
    attributes:
      label: 🗺️ 地圖位置連結（選填）
      description: 可貼上含座標的 Google Maps 或 OpenStreetMap 分享連結，讓地圖顯示精確位置
      placeholder: 例：https://www.google.com/maps/@25.0330,121.5654,18z

  - type: dropdown
    id: issue_type
    attributes:
      label: 🏷️ 問題類型
      options:
        - 人行道缺失/破損
        - 行穿線設計不良
        - 標線/標誌不清
        - 號誌問題
        - 自行車道問題
        - 無障礙設施不足
        - 其他
    validations:
      required: true

  - type: input
    id: custom_type
    attributes:
      label: 🏷️ 自訂問題類型（選填）
      description: 如果選擇「其他」，請在此描述問題類型，方便我們未來新增分類
      placeholder: 例：騎樓佔用、夜間照明不足、違停熱區

  - type: textarea
    id: description
    attributes:
      label: 📝 問題描述
      description: 請詳細說明你觀察到的問題
      placeholder: |
        例如：
        - 這個路口沒有行穿線
        - 人行道太窄，輪椅無法通行
        - 標線褪色看不清楚
    validations:
      required: true

  - type: textarea
    id: photos
    attributes:
      label: 📸 現場照片
      description: 拖曳或貼上照片（強烈建議提供，有助於確認問題）
      placeholder: 直接拖曳照片到這裡上傳

  - type: input
    id: authority
    attributes:
      label: 🏛️ 負責單位（選填）
      description: 如果知道請填寫，不確定可留空由社群補充
      placeholder: 例：台北市交通局、新北市養護工程處

  - type: textarea
    id: additional
    attributes:
      label: 📋 其他資訊（選填）
      description: 任何其他相關資訊
      placeholder: |
        例如：
        - 附近有學校/醫院
        - 曾發生過事故
        - 已向政府反映過但未處理
