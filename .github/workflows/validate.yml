name: 驗證專案

on:
  pull_request:
    paths:
      - 'website/**'
      - 'config/**'
      - 'scripts/**'
      - 'test/**'
      - 'fixtures/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/**'
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'config/**'
      - 'scripts/**'
      - 'test/**'
      - 'fixtures/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Validate and test
        run: npm run check
