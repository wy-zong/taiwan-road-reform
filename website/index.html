<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="台灣交通改革協作平台－透過群眾協作改善道路設計，打造更安全的交通環境">
    <title>台灣交通改革協作平台</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/tokens.css">
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/layout.css">
    <link rel="stylesheet" href="assets/css/components.css">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <span class="logo-icon" aria-hidden="true">🚗</span>
                <h1>台灣交通改革協作平台</h1>
            </div>
            <nav class="nav" aria-label="主要導覽">
                <a href="https://github.com/wy-zong/taiwan-road-reform/issues/new/choose"
                   class="btn btn-primary" target="_blank" rel="noopener noreferrer">
                    ➕ 回報問題
                </a>
                <a href="https://github.com/wy-zong/taiwan-road-reform"
                   class="btn btn-secondary" target="_blank" rel="noopener noreferrer">
                    GitHub
                </a>
            </nav>
        </div>
    </header>

    <p class="app-message" id="app-message" role="status" hidden></p>

    <main class="main" id="main-layout" data-mobile-view="map">
        <aside class="sidebar sidebar-controls">
            <section class="panel stats-panel">
                <h2>📊 統計概覽</h2>
                <div class="stats-grid" id="stats-grid" aria-live="polite"></div>
                <p class="last-updated">資料產生時間：<span id="last-updated">－</span></p>
            </section>

            <section class="panel filter-panel">
                <h2>🔍 篩選</h2>

                <div class="filter-group">
                    <label for="filter-city">縣市</label>
                    <select id="filter-city">
                        <option value="">全部縣市</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label for="filter-status">狀態</label>
                    <select id="filter-status">
                        <option value="">全部狀態</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label for="filter-type">類型</label>
                    <select id="filter-type">
                        <option value="">全部類型</option>
                    </select>
                </div>

                <button class="btn btn-reset" id="reset-filters" type="button">重置篩選</button>
            </section>
        </aside>

        <div class="mobile-view-switch" role="group" aria-label="內容顯示方式">
            <button class="view-button is-active" type="button" data-view="map" aria-pressed="true">地圖</button>
            <button class="view-button" type="button" data-view="list" aria-pressed="false">列表</button>
        </div>

        <section class="map-container" aria-label="道路問題地圖">
            <div id="map" role="region" aria-label="台灣道路問題互動地圖"></div>
            <div class="map-legend" id="map-legend" aria-label="狀態圖例"></div>
        </section>

        <aside class="sidebar sidebar-right">
            <section class="panel issues-panel">
                <h2>📋 問題列表</h2>
                <p class="issues-count">顯示 <span id="issues-count">0</span> 筆</p>
                <div class="issues-list" id="issues-list" aria-live="polite">
                    <p class="no-issues">載入中……</p>
                </div>
            </section>
        </aside>
    </main>

    <footer class="footer">
        <p>
            Made with ❤️ by Taiwan Civic Tech Community |
            <a href="https://github.com/wy-zong/taiwan-road-reform" target="_blank" rel="noopener noreferrer">GitHub</a> |
            <a href="https://creativecommons.org/licenses/by/4.0/deed.zh_TW" target="_blank" rel="noopener noreferrer">CC BY 4.0</a>
        </p>
    </footer>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module" src="assets/js/main.js"></script>
</body>
</html>
